<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Coaching App - Premium SaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
      /* Global Resets */
      html, body {
        background-color: #090d10 !important;
        color: #e2e8f0 !important;
        font-family: 'Inter', system-ui, sans-serif !important;
        margin: 0;
        scroll-behavior: smooth;
      }

      /* Custom Scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #090d10;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #10b981;
      }

      /* Base Layouts & Page Containers */
      main, .main, [style*="min-height"], [style*="minHeight"], [style*="page"] {
        background: #090d10 !important;
        background-image: none !important;
        color: #ffffff !important;
      }

      /* Cards & Surfaces */
      .card, 
      [style*="background: white"], 
      [style*="background: #ffffff"], 
      [style*="background:rgb(255, 255, 255)"], 
      [style*="backgroundColor: white"], 
      .featureCard, 
      .stat-card, 
      .statItem, 
      .dashboard-card,
      .create-program-section,
      .profile-section,
      .appointments-section,
      .messages-section,
      .message-box,
      .empty-state {
        background: #0f1319 !important;
        background-color: #0f1319 !important;
        border: 1px solid rgba(16, 185, 129, 0.12) !important;
        border-radius: 20px !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
        color: #ffffff !important;
        box-sizing: border-box;
      }

      /* Typography adjustments */
      h1, h2, h3, h4, h5, h6, 
      [style*="color: #10201c"], 
      [style*="color: rgb(16, 32, 28)"], 
      [style*="color: #0f172a"],
      .card-title, 
      .section-title {
        color: #ffffff !important;
        font-family: 'Outfit', sans-serif !important;
        letter-spacing: -0.5px;
      }

      p, span, 
      [style*="color: #52645f"], 
      [style*="color: rgb(82, 100, 95)"], 
      [style*="color: #475569"],
      .card-content, 
      .card-description {
        color: #94a3b8 !important;
      }

      /* Hero Section Style */
      .hero, [style*="backgroundImage"] {
        border-radius: 24px !important;
        border: 1px solid rgba(16, 185, 129, 0.2) !important;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5) !important;
      }

      .statsBand, [style*="statsBand"] {
        background: transparent !important;
      }

      .statItem strong {
        color: #10b981 !important;
        font-size: 32px !important;
        font-family: 'Outfit', sans-serif;
      }

      /* Primary Actions / Buttons */
      .btn-primary, 
      .btn-primary-gradient,
      [style*="background: #0f766e"], 
      [style*="background: rgb(15, 118, 110)"], 
      [style*="background: #22c55e"], 
      [style*="background: rgb(34, 197, 94)"] {
        background: linear-gradient(135deg, #10b981, #059669) !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: 12px !important;
        font-weight: 800 !important;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3) !important;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
        cursor: pointer;
      }

      .btn-primary:hover, 
      [style*="background: #0f766e"]:hover, 
      [style*="background: #22c55e"]:hover {
        transform: translateY(-2px) !important;
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5) !important;
        filter: brightness(1.08) !important;
      }

      /* Secondary Buttons */
      .btn-secondary, 
      [style*="background: rgba(255, 255, 255, 0.16)"], 
      [style*="background: rgb(241, 245, 249)"], 
      [style*="background:#f1f5f9"], 
      [style*="background: #f1f5f9"] {
        background: rgba(255, 255, 255, 0.06) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        color: #ffffff !important;
        border-radius: 12px !important;
        box-shadow: none !important;
        transition: all 0.2s ease !important;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.12) !important;
        border-color: rgba(255, 255, 255, 0.2) !important;
      }

      /* Inputs and Form Controls */
      input, textarea, select, .form-input, .form-textarea, .profile-input, .profile-textarea {
        background: #131920 !important;
        border: 1px solid rgba(16, 185, 129, 0.18) !important;
        color: #ffffff !important;
        border-radius: 12px !important;
        padding: 12px 16px !important;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2) !important;
        transition: all 0.2s ease !important;
      }

      input:focus, textarea:focus, select:focus {
        border-color: #10b981 !important;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25) !important;
        outline: none !important;
      }

      label, .form-label, .profile-label {
        color: #94a3b8 !important;
        font-weight: 600 !important;
        font-size: 13px !important;
        margin-bottom: 6px !important;
        display: block;
      }

      /* Tables & Administrative Interfaces */
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 20px !important;
        background: #0f1319 !important;
        border-radius: 14px !important;
        overflow: hidden !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
        border: 1px solid rgba(16, 185, 129, 0.12) !important;
      }

      th {
        background: #131920 !important;
        color: #ffffff !important;
        font-weight: 800 !important;
        padding: 16px 20px !important;
        text-align: left !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        font-family: 'Outfit', sans-serif;
      }

      td {
        padding: 16px 20px !important;
        color: #94a3b8 !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        font-size: 14px !important;
      }

      tr:hover td {
        background: rgba(16, 185, 129, 0.04) !important;
        color: #ffffff !important;
      }

      /* Hover micro-animations on Cards */
      .card, .featureCard, .statItem, .dashboard-card {
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease !important;
      }

      .card:hover, .featureCard:hover, .statItem:hover, .dashboard-card:hover {
        transform: translateY(-4px) !important;
        border-color: rgba(16, 185, 129, 0.35) !important;
        box-shadow: 0 15px 35px rgba(16, 185, 129, 0.15) !important;
      }

      /* Badges & Icons */
      .badge, .card-badge, .status-badge {
        padding: 6px 12px !important;
        border-radius: 999px !important;
        font-size: 11px !important;
        font-weight: 900 !important;
        letter-spacing: 0.5px !important;
        text-transform: uppercase !important;
      }

      /* Empty states / fallback blocks */
      .empty-state {
        border: 1px dashed rgba(16, 185, 129, 0.25) !important;
        padding: 48px 32px !important;
        text-align: center !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
